name: Bug report
description: Report a reproducible problem with the Tandem CLI or desktop app.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Remove credentials, private code, provider transcripts, and sensitive
        filesystem paths before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest sequence of commands or UI actions that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Environment
      description: Include OS, Tandem version, Node version, and relevant provider CLI versions.
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized `tandem doctor` output
      description: Remove usernames, repository paths, and other private data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials and private repository data.
          required: true
