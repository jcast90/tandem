name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm

      - name: Configure test Git identity
        run: |
          git config --global user.name "Tandem CI"
          git config --global user.email "tandem-ci@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Validate project
        run: pnpm check

      - name: Build desktop web surface
        run: pnpm --dir apps/desktop build
