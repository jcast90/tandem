name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.9
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release version
        run: |
          node - <<'NODE'
          const { readFileSync } = require("node:fs");
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          const files = ["package.json", "apps/desktop/package.json", "apps/desktop/src-tauri/tauri.conf.json"];
          for (const file of files) {
            const actual = JSON.parse(readFileSync(file, "utf8")).version;
            if (actual !== version) throw new Error(`${file} has ${actual}; expected ${version}`);
          }
          NODE
      - run: bash -n scripts/*.sh
      - run: pnpm check

  publish-macos:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.9
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Import Apple Developer certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/tandem-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${RUNNER_TEMP}/certificate.p12" -k "${KEYCHAIN_PATH}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          test -n "${SIGNING_IDENTITY}"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "${SIGNING_IDENTITY}" >> "${GITHUB_ENV}"
      - run: pnpm install --frozen-lockfile
      - name: Build signed and notarized universal macOS release
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --dir apps/desktop tauri build --target universal-apple-darwin
      - name: Stage release assets
        run: |
          mkdir release
          cp apps/desktop/src-tauri/resources/cli.mjs release/tandem-cli.mjs
          DMG="$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "${DMG}"
          cp "${DMG}" release/Tandem-macos-universal.dmg
          cp scripts/install-release.sh release/install.sh
          cd release
          shasum -a 256 tandem-cli.mjs > tandem-cli.mjs.sha256
          shasum -a 256 Tandem-macos-universal.dmg > Tandem-macos-universal.dmg.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes --title "Tandem ${GITHUB_REF_NAME#v}"
