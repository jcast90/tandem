[package]
name = "tandem-desktop"
version = "0.1.0"
description = "A calm desktop conversation layer for Tandem"
authors = ["Jonathan Lancaster"]
edition = "2021"

[lib]
name = "tandem_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-websocket = "2.4.2"
